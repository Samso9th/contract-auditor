name: Contract Auditor
# Marketplace hard-limits this to 125 characters and shows it verbatim on the
# listing card, so it is written to fit rather than truncated by GitHub.
description: >-
  Finds where your API code, OpenAPI spec and docs disagree. Every finding ships
  with a test that proves it.
author: Samso9th
branding:
  icon: git-pull-request
  color: purple

inputs:
  spec:
    description: Path to the OpenAPI document your integrators build against.
    required: true
  source-dir:
    description: Directory containing the API source.
    required: false
    default: "."
  language:
    description: "go, typescript, or auto to detect."
    required: false
    default: auto
  strip-prefix:
    description: 'Path prefix to strip from routes so they match the spec, e.g. "/api/v1".'
    required: false
    default: ""
  contract-middleware:
    description: >-
      Only audit routes guarded by these middleware, one name per line or comma
      separated, e.g. "authenticate". Names are the identifiers as they appear in
      the registration. This is how an integrator-facing API is told apart from a
      dashboard or admin surface registered in the same codebase: they differ by
      which guard they sit behind, not by their path, so a route added next week
      lands on the right side without anyone editing this list. Extracted for
      TypeScript today; the run fails rather than silently excluding everything
      where the language supplies no middleware.
    required: false
    default: ""
  exclude-paths:
    description: >-
      Paths to leave out of the audit, one glob per line or comma separated,
      e.g. "/auth/*". Matched against the path as the spec writes it, so after
      strip-prefix has been removed. `*` crosses slashes, and a trailing /*
      covers the collection itself, so /auth/* excludes /auth as well. Use it for routes
      that are deliberately undocumented - a dashboard's own session endpoints,
      internal health checks - so the report stays about the contract your
      integrators were promised.
    required: false
    default: ""
  api-key:
    description: >-
      OpenRouter (or any OpenAI-compatible) API key. Omit to run the
      deterministic layer only: no model calls, no cost, still catches most drift.
    required: false
    default: ""
  base-url:
    description: OpenAI-compatible endpoint. Defaults to OpenRouter.
    required: false
    default: https://openrouter.ai/api/v1
  model:
    description: >-
      Model id for the judgment pass. Any model your endpoint serves, not just
      the default: the client sends whatever id it is given.
    required: false
    default: z-ai/glm-5.3-flash
  reasoning:
    description: >-
      How much deliberation to ask the model for: off, low, medium or high.
      Slower and dearer on every endpoint. Leave empty to use the model's own
      default, which is what the published results were measured under.
    required: false
    default: ""
  workers:
    description: Concurrent model calls.
    required: false
    default: "8"
  fail-on:
    description: >-
      Lowest severity that fails the job: critical, high, medium, low, or none.
      Start at none to adopt in warn mode; tighten once the backlog is clear.
    required: false
    default: high
  memory-url:
    description: >-
      Turns on self-improvement. Where this audit's claim ledger is read from and
      written to, e.g. s3://my-bucket/contract-auditor (any S3-compatible store),
      https://host/ledger.jsonl, cloudinary://cloud/public_id, or ipfs://name.
      Left empty, the auditor keeps no memory at all - nothing is stored in your
      repository, and nothing ships inside this action's image. Configuring it
      also turns on the verification gate, since a claim with no verdict teaches
      nothing.
    required: false
    default: ""
  memory-key-id:
    description: >-
      Access key id for the memory store (S3-compatible), or the Cloudinary API
      key. Pass a secret, never a literal.
    required: false
    default: ""
  memory-secret:
    description: Secret key for the memory store, or the Cloudinary API secret.
    required: false
    default: ""
  memory-token:
    description: >-
      Bearer token for an HTTP memory store, or the JWT for an IPFS pinning
      service.
    required: false
    default: ""
  memory-region:
    description: Region for an S3-compatible memory store.
    required: false
    default: ""
  webhook-url:
    description: >-
      POST the full JSON report here. Intended for a data sink such as Postgres;
      for Slack or Telegram use the dedicated inputs below, which send a formatted
      message rather than raw JSON.
    required: false
    default: ""
  slack-webhook-url:
    description: >-
      Slack incoming webhook. Sends a formatted message containing verified
      findings only, and stays silent on a clean run.
    required: false
    default: ""
  telegram-bot-token:
    description: Telegram bot token. Requires telegram-chat-id.
    required: false
    default: ""
  telegram-chat-id:
    description: Telegram chat to post into.
    required: false
    default: ""
  notify-min-severity:
    description: Lowest severity worth interrupting a human for.
    required: false
    default: high
  webhook-secret:
    description: Sent as X-Auditor-Token so your receiver can authenticate the POST.
    required: false
    default: ""
  brief-name:
    description: >-
      Base name for the fix brief. Produces <name>_brief.md and <name>_brief.zip.
    required: false
    default: contract-audit
  brief-dir:
    description: Directory the brief and its tests are written to, for uploading as an artifact.
    required: false
    default: contract-audit-brief
  sarif-path:
    description: Where to write SARIF for upload to code scanning.
    required: false
    default: contract-audit.sarif
  summary-path:
    description: Where to write the Markdown summary.
    required: false
    default: contract-audit.md

outputs:
  findings:
    description: Total findings.
  critical:
    description: Findings at critical severity.
  high:
    description: Findings at high severity.
  sarif:
    description: Path to the SARIF file.
  summary:
    description: Path to the Markdown summary.
  brief:
    description: Path to the fix brief, ready to paste into a coding agent.
  brief-zip:
    description: Path to the brief plus the generated tests as runnable files.
  brief-dir:
    description: Directory holding the brief, the zip and the tests. Upload this as an artifact.

runs:
  using: docker
  image: docker://ghcr.io/samso9th/contract-auditor:v1
