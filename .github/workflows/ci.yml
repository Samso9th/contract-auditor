name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          # setup-node v5 began caching package manager downloads on its own.
          # This job installs one global package and never restores project
          # dependencies, so the cache would only add steps that never pay off.
          package-manager-cache: false

      - name: Install TypeScript for the route extractor
        run: npm install -g typescript@5

      # Formatting and vet across both Go modules: the extractor and the
      # evaluation fixture. The fixture has to stay buildable or every case
      # built from it is invalid.
      - name: Go format and vet
        run: |
          set -e
          for module in auditor/tools/goroutes eval/fixture; do
            echo "--- $module"
            unformatted=$(gofmt -l "$module")
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt needed in: $unformatted"; exit 1
            fi
            (cd "$module" && go vet ./... && go build ./...)
          done

      - name: Python syntax
        run: |
          python3 -m compileall -q auditor baseline eval
          echo "all modules compile"

      - name: Node syntax
        run: node --check auditor/tools/tsroutes/extract.mjs

      # Route middleware is what tells an integrator-facing API apart from an
      # admin surface registered in the same codebase, so contract-middleware
      # is only as good as this extraction. Both registration styles are
      # checked: the per-route guard and the router-level router.use(mw).
      - name: The extractor records route middleware
        run: |
          set -e
          mkdir -p /tmp/mw/src
          cat > /tmp/mw/src/routes.js <<'EOF'
          import { Router } from "express";
          import { authenticate } from "./auth.js";
          import { adminAuthenticate } from "./adminAuth.js";
          const router = Router();
          router.use(authenticate);
          router.get("/orders", listOrders);
          router.get("/stats", adminAuthenticate, getStats);
          export default router;
          EOF
          node auditor/tools/tsroutes/extract.mjs --dir /tmp/mw > /tmp/mw/table.json
          python3 - <<'EOF'
          import json
          routes = {r["path"]: r.get("middleware") or [] for r in
                    json.load(open("/tmp/mw/table.json"))["routes"]}
          assert routes.get("/orders") == ["authenticate"], routes
          assert routes.get("/stats") == ["authenticate", "adminAuthenticate"], routes
          print("router-level and per-route middleware both recorded")
          EOF

      # The guard rules exist because R8 could only read handlers, and a handler
      # that does not read a header proves nothing when auth is middleware. Both
      # directions are checked, on the pattern that motivated them: a route
      # registered above the router.use() line that guards everything below it.
      - name: The guard rules catch auth drift in both directions
        run: |
          set -e
          mkdir -p /tmp/guard/src
          cat > /tmp/guard/src/auth.js <<'EOF'
          export const authenticate = (req, res, next) => {
            const key = req.headers["x-api-key"];
            if (!key) return res.status(401).json({ error: "unauthorized" });
            next();
          };
          EOF
          cat > /tmp/guard/src/routes.js <<'EOF'
          import { Router } from "express";
          import { authenticate } from "./auth.js";
          const router = Router();
          router.post("/hooks/incoming", handleHook);
          router.use(authenticate);
          router.get("/health", health);
          export default router;
          EOF
          cat > /tmp/guard/openapi.json <<'EOF'
          {"openapi":"3.0.0","info":{"title":"t","version":"1"},
           "components":{"securitySchemes":{"ApiKeyAuth":{"type":"apiKey","in":"header","name":"x-api-key"}}},
           "paths":{
            "/hooks/incoming":{"post":{"security":[{"ApiKeyAuth":[]}],"responses":{"200":{"description":"ok"}}}},
            "/health":{"get":{"security":[],"responses":{"200":{"description":"ok"}}}}}}
          EOF
          python3 auditor/tools/diff.py /tmp/guard/src /tmp/guard/openapi.json \
            --language typescript --json > /tmp/guard/out.json
          python3 - <<'EOF'
          import json
          kinds = {f["kind"]: f for f in json.load(open("/tmp/guard/out.json"))["findings"]}
          missing = kinds.get("auth_guard_missing")
          extra = kinds.get("auth_guard_undocumented")
          assert missing and missing["path"] == "/hooks/incoming", kinds
          assert missing["severity"] == "critical", missing
          assert extra and extra["path"] == "/health", kinds
          print("both guard directions reported")
          EOF

      - name: Shell syntax
        run: bash -n entrypoint.sh

      # The fixture builds, all 16 cases compile, and the scorer returns a
      # perfect score against ground truth fed back as a run. If the scorer is
      # wrong, every number this project reports is wrong.
      - name: Verify fixture, cases and scorer
        run: make check

      # The deterministic tools, offline. No API key, no cost, no network.
      - name: Verify deterministic tools
        run: make test-tools

      # The no-model layer must keep hitting its committed bar. This is the
      # regression test for the project's central claim.
      - name: Deterministic evaluation
        run: |
          python3 auditor/run_deterministic.py
          cd eval && python3 score.py --run ../reports/runs/deterministic --json > /tmp/score.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/score.json"))["summary"]
          print(json.dumps(s, indent=2))
          failures = []
          if s["precision"] < 1.0:      failures.append(f"precision {s['precision']} < 1.0")
          if s["recall"] < 0.80:        failures.append(f"recall {s['recall']} < 0.80")
          if s["false_positives"] != 0: failures.append(f"{s['false_positives']} false positives")
          if s["decoys_clean"] != "4/4": failures.append(f"decoys {s['decoys_clean']}")
          if failures:
              print("::error::deterministic layer regressed: " + "; ".join(failures))
              sys.exit(1)
          print("deterministic layer holds its committed bar")
          PY

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only; publishing happens in release.yml. A pull request from a
      # fork must never be able to push an image.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: contract-auditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -e
          docker run --rm --entrypoint python3 contract-auditor:ci \
            /opt/auditor/auditor/llm.py --models
          docker run --rm --entrypoint sh contract-auditor:ci -c \
            'go version && python3 --version && node --version && tsc --version'

      # The runner spells a hyphenated input INPUT_SOURCE-DIR, which is not a
      # name any shell can expand, so reading it wrongly is silent: every
      # hyphenated input falls back to its default and the audit still runs.
      # The clean fixture answers 0 only when source-dir and strip-prefix both
      # arrive; with either one lost it reports the whole repository's drift.
      - name: The action reads its hyphenated inputs
        run: |
          set -e
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
            -e 'INPUT_SPEC=eval/fixture/spec/openapi.json' \
            -e 'INPUT_SOURCE-DIR=eval/fixture' \
            -e 'INPUT_LANGUAGE=go' \
            -e 'INPUT_STRIP-PREFIX=/v1' \
            -e 'INPUT_FAIL-ON=none' \
            contract-auditor:ci | tee audit.log
          grep -q 'source     eval/fixture' audit.log
          grep -q 'findings: 0 ' audit.log
